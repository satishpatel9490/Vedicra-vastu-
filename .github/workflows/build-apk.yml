name: Build Vedicra Vastu APK

on:
  push:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK & Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ] && [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            (yes 2>/dev/null || true) | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            for pkg in "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1"; do
              "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "$pkg" || true
            done
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Copy APK with app name
        run: cp app/build/outputs/apk/debug/app-debug.apk Vedicra-Vastu-Solutions.apk

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Vedicra-Vastu-Solutions-APK
          path: Vedicra-Vastu-Solutions.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Releases
        if: github.ref_type == 'branch'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Vedicra Vastu APK (Latest)
          body: Direct installable APK built automatically from the latest code.
          files: Vedicra-Vastu-Solutions.apk
